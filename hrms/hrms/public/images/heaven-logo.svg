<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Main circle background -->
  <circle cx="50" cy="50" r="46" fill="url(#skyGrad)" />

  <!-- Inner glow overlay -->
  <circle cx="50" cy="46" r="38" fill="url(#glowGrad)" />

  <!-- Cloud base (bottom arc) -->
  <ellipse cx="50" cy="68" rx="26" ry="10" fill="white" opacity="0.95"/>

  <!-- Cloud bumps -->
  <circle cx="34" cy="65" r="9" fill="white" opacity="0.95"/>
  <circle cx="44" cy="60" r="11" fill="white" opacity="0.95"/>
  <circle cx="56" cy="60" r="11" fill="white" opacity="0.95"/>
  <circle cx="66" cy="65" r="9" fill="white" opacity="0.95"/>

  <!-- Star / sparkle at top center -->
  <g transform="translate(50,30)" fill="#fef3c7">
    <!-- 4-pointed star -->
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" opacity="0.95"/>
  </g>

  <!-- Small star left -->
  <g transform="translate(31,38)" fill="#e0e7ff">
    <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" opacity="0.7"/>
  </g>

  <!-- Small star right -->
  <g transform="translate(69,38)" fill="#e0e7ff">
    <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" opacity="0.7"/>
  </g>

  <!-- Thin border ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
</svg>

